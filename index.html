<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Chenyao Tang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=DM+Sans:400,500" rel="stylesheet">
    <style>
      body {
        background-color: #ffffff;
        color: #000000;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .dark body {
        background-color: #000000;
        color: #ffffff;
      }
      
      /* Image Loading Effect - Same as LuN3cy */
      img {
        opacity: 0;
        transition: opacity 0.5s ease-out;
      }
      
      img.loaded {
        opacity: 1;
      }
      
      /* Image Container with Skeleton */
      .img-loading-container {
        position: relative;
        overflow: hidden;
      }
      
      .img-loading-skeleton {
        position: absolute;
        inset: 0;
        background-color: #e5e7eb;
        animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      
      .dark .img-loading-skeleton {
        background-color: #1f2937;
      }
      
      .img-loading-skeleton.hidden {
        display: none;
      }
      
      .img-loading-spinner {
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid #d1d5db;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      .dark .img-loading-spinner {
        border-color: #4b5563;
        border-top-color: transparent;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* Custom Bullet Point Style */
      .bullet-point {
        display: inline-block;
        width: 8px;
        height: 8px;
        background-color: currentColor;
        border-radius: 50%;
        margin-right: 12px;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Modal Animations */
      .modal-enter {
        opacity: 0;
        transform: scale(0.95);
      }
      .modal-enter-active {
        opacity: 1;
        transform: scale(1);
        transition: opacity 300ms cubic-bezier(0.16, 1, 0.3, 1), transform 300ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .modal-exit {
        opacity: 1;
        transform: scale(1);
      }
      .modal-exit-active {
        opacity: 0;
        transform: scale(0.95);
        transition: opacity 200ms cubic-bezier(0.16, 1, 0.3, 1), transform 200ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      
      .backdrop-enter {
        opacity: 0;
        backdrop-filter: blur(0px);
      }
      .backdrop-enter-active {
        opacity: 1;
        backdrop-filter: blur(8px);
        transition: opacity 400ms ease, backdrop-filter 400ms ease;
      }
      .backdrop-exit {
        opacity: 1;
        backdrop-filter: blur(8px);
      }
      .backdrop-exit-active {
        opacity: 0;
        backdrop-filter: blur(0px);
        transition: opacity 300ms ease, backdrop-filter 300ms ease;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script type="module" src="/index.tsx"></script>
    
    <!-- Image Loading Effect - Same as LuN3cy -->
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.tagName === 'IMG') {
                wrapImageWithSkeleton(node);
              } else if (node.querySelectorAll) {
                node.querySelectorAll('img').forEach(wrapImageWithSkeleton);
              }
            });
          });
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
        
        // Wrap existing images
        document.querySelectorAll('img').forEach(wrapImageWithSkeleton);
        
        function wrapImageWithSkeleton(img) {
          // Skip if already wrapped
          if (img.parentElement?.classList.contains('img-loading-container')) return;
          
          // Create wrapper
          const wrapper = document.createElement('div');
          wrapper.className = 'img-loading-container';
          
          // Create skeleton
          const skeleton = document.createElement('div');
          skeleton.className = 'img-loading-skeleton';
          skeleton.innerHTML = '<div class="img-loading-spinner"></div>';
          
          // Wrap image
          img.parentNode.insertBefore(wrapper, img);
          wrapper.appendChild(skeleton);
          wrapper.appendChild(img);
          
          // Handle load
          if (img.complete) {
            img.classList.add('loaded');
            skeleton.classList.add('hidden');
          } else {
            img.addEventListener('load', function() {
              img.classList.add('loaded');
              skeleton.classList.add('hidden');
            });
          }
        }
      });
    </script>
  </body>
</html>
